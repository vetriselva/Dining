spring:
  application:
    name: Dining

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/Dining
    username: appuser
    password: apppass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false


  flyway:
    user: root
    password: 1234
    enabled: false
    locations: classpath:db.migration
    baseline-on-migrate: true
